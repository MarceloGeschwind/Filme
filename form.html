<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario</title>
<link rel="stylesheet" href="css/estilo.css">
</head>

<body id="bodyform">

<div class="titform">
<h1>Formulário</h1>
</div>

<div class="formbon">

<form id="form">

    <label for="name">Nome: </label>
    <input type="text" id="name">
    <br><br>
    <label for="mail">Email:</label>
    <input type="email" id="mail">
    <br><br>
    <fieldset>

        <legend>Gênero Favorito</legend>

        <input type="radio" name="genero" id="Ação">
        <Label for="Açao">Ação</Label>

        <input type="radio" name="genero" id="Drama">
        <Label for="Drama">Drama</Label>

        <input type="radio" name="genero" id="Romance">
        <Label for="Romance">Romance</Label>

        <input type="radio" name="genero" id="Terror">
        <Label for="Terror">Terror</Label>

        <input type="radio" name="genero" id="Ficção-Científica">
        <Label for="Ficção-Científica">Ficção Científica</Label>
        <br>
        <input type="radio" name="genero" id="Comédia">
        <Label for="Comédia">Comédia</Label>

        <input type="radio" name="genero" id="Aventura">
        <Label for="Aventura">Aventura</Label>

        <input type="radio" name="genero" id="Animação">
        <Label for="Animação">Animação</Label>

        <input type="radio" name="genero" id="Suspense">
        <Label for="Suspense">Suspense</Label>

        <input type="radio" name="genero" id="Fantasia">
        <Label for="Fantasia">Fantasia</Label>

    </fieldset>
    <br>
    <label for="film">Filme Favorito:</label>
    <input type="text" id="film">
    <br><br>
    <label for="ator">Ator Favorito:</label>
    <input type="text" id="ator">
    <br><br>    
    <fieldset>

        <legend>Você prefere assistir filme dublado ou legendado?</legend>

        <input type="radio" name="filmleg-or-du" id="Dublado">
        <Label for="Dublado">Dublado</Label>

        <input type="radio" name="filmleg-or-du" id="Legendado">
        <Label for="Legendado">Legendado</Label>

    </fieldset>
    <br><br>
    <fieldset>
        <legend>VOCÊ PREFERE MARVEL OU DC?!</legend>
        
        <input type="radio" name="MarvelouDc" id="Marvel">
        <Label for="Marvel">Marvel</Label>

        <input type="radio" name="MarvelouDc" id="DC">
        <Label for="DC">DC</Label>

    </fieldset>
    <br>

    <input type="reset">
    <input type="submit" value="Enviar">
</form>

</div>

</body>
</html>
